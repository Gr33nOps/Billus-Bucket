<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Billu's Bucket</title>
    <meta name="billu-build" content="__BILLU_ASSET_VERSION__" />
    <base href="./" />
    <link rel="icon" type="image/png" sizes="32x32" href="Assets/favicon.png?v=__BILLU_ASSET_VERSION__" />
    <link href="css/app.css?v=__BILLU_ASSET_VERSION__" rel="stylesheet" />
    <!-- PORTAL_SDK_SCRIPT_SLOT -->
</head>

<body>
    <div id="viewportProbe" aria-hidden="true"></div>
    <div id="loadingOverlay" role="status" aria-label="Loading Billu's Bucket">
        <div class="loading-scene">
            <img class="loading-logo" src="Assets/loading-logo.png?v=__BILLU_ASSET_VERSION__" alt="Billu's Bucket" width="128" height="12" />
            <img class="loading-bucket" src="Assets/bucket.png?v=__BILLU_ASSET_VERSION__" alt="" width="28" height="16" />
            <div class="loading-subtitle">LOADING...</div>
        </div>
    </div>

    <div id="app"></div>
    <div id="rotatePrompt" role="status">
        <img src="Assets/favicon.png?v=__BILLU_ASSET_VERSION__" alt="" width="64" height="64" />
        <p>TURN YOUR PHONE SIDEWAYS</p>
        <span>Billu needs the whole rooftop.</span>
    </div>

    <div id="blazor-error-ui">
        <span id="game-error-message">GAME ERROR OCCURRED.</span>
        <a href="" class="reload" style="color:#f0d398;margin-left:8px;">RELOAD</a>
    </div>

    <script src="platform-config.js?v=__BILLU_ASSET_VERSION__"></script>
    <script src="js/platform-bridge.js?v=__BILLU_ASSET_VERSION__"></script>

    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.10.0.3.js"></script>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
</body>

</html>
