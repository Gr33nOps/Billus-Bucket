name: Build & Deploy WebAssembly (GitHub Pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check_pages.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build solution (zero warnings)
        run: dotnet build BillusBucket.sln -c Release -warnaserror

      - name: Run gameplay, leaderboard, and difficulty checks
        run: dotnet run --project GameTests/GameTests.csproj -c Release --no-build

      - name: Publish browser WebAssembly bundle
        shell: pwsh
        run: ./tools/publish_web.ps1 -Platform web -OutputDir dist/pages

      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: billus-bucket-web
          path: dist/pages/

      - name: Check if GitHub Pages is enabled for this repository
        id: check_pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled yet on this repository (skipping Pages deploy step)."
          fi

      - name: Upload GitHub Pages artifact
        if: steps.check_pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy-pages:
    needs: build-and-test
    if: needs.build-and-test.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
